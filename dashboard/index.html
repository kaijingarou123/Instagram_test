<title>Earthspirit Field Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: field station control room. One top bar with six tabs, a moss-and-lichen palette,
   content in a 12-column grid that collapses to one column on phones. Ochre marks anything a person owns. */
:root{
  --bg:#eef1ec; --surface:#fbfcfa; --sunk:#e3e8e1; --line:#d5ddd3; --line2:#c2ccc0;
  --ink:#16201b; --ink2:#46544c; --muted:#76837b;
  --moss:#2f6a4f; --moss-wash:#dcebe2; --moss-ink:#1f4c38;
  --ochre:#a8611c; --ochre-wash:#f6e6d4;
  --tide:#2b6683; --tide-wash:#dbe9f1;
  --good:#2f8a4c; --warn:#c98a12; --bad:#c2413a; --bad-wash:#f8e1df;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(22,32,27,.06),0 4px 14px rgba(22,32,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1310; --surface:#141c18; --sunk:#1a241f; --line:#25312b; --line2:#33413a;
  --ink:#e3eae5; --ink2:#b1beb6; --muted:#7f8c85;
  --moss:#6cc297; --moss-wash:#1c3a2c; --moss-ink:#9fdcbc;
  --ochre:#e3a25e; --ochre-wash:#3a2a19;
  --tide:#7ab6d4; --tide-wash:#1a3240;
  --good:#5cc27e; --warn:#e2ac3c; --bad:#ec7a72; --bad-wash:#3d1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1310; --surface:#141c18; --sunk:#1a241f; --line:#25312b; --line2:#33413a;
  --ink:#e3eae5; --ink2:#b1beb6; --muted:#7f8c85;
  --moss:#6cc297; --moss-wash:#1c3a2c; --moss-ink:#9fdcbc;
  --ochre:#e3a25e; --ochre-wash:#3a2a19;
  --tide:#7ab6d4; --tide-wash:#1a3240;
  --good:#5cc27e; --warn:#e2ac3c; --bad:#ec7a72; --bad-wash:#3d1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--moss)} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--moss);display:grid;place-items:center}
.brand .mk svg{width:19px;height:19px;stroke:var(--surface)}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;margin-top:4px;scrollbar-width:none}
.tabs a{padding:9px 14px;color:var(--ink2);font-weight:600;font-size:13.5px;border-bottom:2.5px solid transparent;white-space:nowrap;text-decoration:none;display:flex;gap:7px;align-items:center}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--moss)}
.tabs .ct{font-family:var(--mono);font-size:11px;background:var(--sunk);color:var(--ink2);border-radius:999px;padding:0 7px}
.tabs .ct.hot{background:var(--ochre-wash);color:var(--ochre)}
.tabs .ct.red{background:var(--bad-wash);color:var(--bad)}

.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 70px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;margin-bottom:18px}
.pagehead h1{font-size:28px;font-weight:700}
.pagehead p{margin:4px 0 0;color:var(--ink2);max-width:70ch}

.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card>.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card h2{font-size:16px;font-weight:600}
.sub{font-size:12px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--moss);border-color:var(--moss);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.stop{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--ink2)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.p-good{background:var(--moss-wash);color:var(--moss-ink)} .p-warn{background:var(--ochre-wash);color:var(--ochre)} .p-bad{background:var(--bad-wash);color:var(--bad)} .p-tide{background:var(--tide-wash);color:var(--tide)}
.p-human{background:var(--ochre-wash);color:var(--ochre)} .p-agent{background:var(--moss-wash);color:var(--moss-ink)}
.k-reel{background:var(--tide-wash);color:var(--tide)} .k-carousel{background:var(--moss-wash);color:var(--moss-ink)}

.alert{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;background:var(--bad-wash);color:var(--bad);border:1px solid var(--bad);font-weight:600}
.alert.warn{background:var(--ochre-wash);color:var(--ochre);border-color:var(--ochre)}
.alert ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.alert svg{width:20px;height:20px;flex:none;stroke:currentColor;margin-top:1px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px 9px;min-width:0;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;color:var(--muted)}
.kpi .d.up{color:var(--good)}
.kpi svg{display:block;margin-top:4px}
.brief{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.brief li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;font-size:14px}
.brief li::before{content:"";width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--dot,var(--muted))}
.rows{display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.rows .r:first-child{border-top:0;padding-top:0}
.rows .t{font-weight:600}
.rows .m{font-size:12px;color:var(--muted)}

/* top 5 */
.t5{border-top:3px solid var(--moss)}
.t5h{margin:-4px 0 12px;color:var(--ink2);max-width:80ch}
.t5l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.t5l li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.t5l li:first-child{border-top:0;padding-top:2px}
.t5n{font-family:var(--display);font-size:24px;font-weight:700;color:var(--moss);line-height:1.1}
.t5t{font-family:var(--display);font-size:16px;font-weight:600;line-height:1.3}
.t5w{color:var(--ink2);font-size:13.5px;margin-top:2px}
.t5c{font-size:13px;margin-top:6px}
.t5f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.postnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.postnav a.btn{text-decoration:none;color:var(--ink)}

/* plan list */
.tgrp{padding:10px 0;border-top:1px solid var(--line)}
.tgrp:first-child{border-top:0}
.tgrp h3{font-family:var(--body);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.tlist{list-style:none;margin:0;padding:0}
.tk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-left:3px solid var(--moss);padding-left:10px;margin:4px 0}
.tk.human{border-left-color:var(--ochre)}
.tick{width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);background:var(--surface);cursor:pointer;margin-top:1px}
.tick:hover{border-color:var(--moss);background:var(--moss-wash)}
.tick.ro{cursor:default}
.tk summary{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;cursor:pointer;list-style:none}
.tk summary::-webkit-details-marker{display:none}
.tk .tt{font-weight:600;font-size:13.5px;margin-right:2px}
.tk .td{margin:6px 0;font-size:13px;color:var(--ink2)}
.slist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .dot{width:9px;height:9px;border-radius:50%}
.srow .sn{display:flex;flex-direction:column;min-width:0}
.srow .sn .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow>.sub,.srow>.btn{grid-column:2/4;justify-self:start}
.srow>.pill{justify-self:end}
.loop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.loop div{background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink2)}
.loop div.on{background:var(--moss-wash);color:var(--moss-ink);box-shadow:inset 0 0 0 1.5px var(--moss)}
.loop b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
@media (max-width:560px){.loop{grid-template-columns:minmax(0,1fr)}}

/* tasks strip */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border-top:3px solid var(--st,var(--line2))}
.task .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.task b{font-size:13.5px;line-height:1.3}
.task .doing{font-size:12.5px;color:var(--ink2);min-height:2.6em}
.task dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0;font-size:12px}
.task dt{color:var(--muted)} .task dd{margin:0;font-family:var(--mono);font-size:11.5px}
.task .f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}

/* kanban */
.planwrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-family:var(--body);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:2px 4px 2px;display:flex;justify-content:space-between}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:3px solid var(--moss)}
.pc.human{border-left-color:var(--ochre)}
.pc .t{font-weight:600;font-size:13px;line-height:1.35}
.pc p{margin:4px 0 6px;font-size:12.5px;color:var(--ink2)}
.pc .f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.pc details summary{font-size:11.5px;color:var(--muted);cursor:pointer}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:640px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.feed li:first-child{border-top:0}
.feed .w{grid-column:2;color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.addform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr) auto auto;gap:8px;margin-top:12px}

/* calendar */
.calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.calhead div{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.past{background:var(--sunk)}
.day.today{border:2px solid var(--moss)}
.day .dn{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--ink2)}
.day .dn .num{font-size:12px}
.aw{font-size:10.5px;color:var(--ochre);font-weight:600;line-height:1.25}
.chip{display:block;border-radius:7px;padding:4px 6px;font-size:11.5px;line-height:1.25;text-decoration:none;color:var(--ink);background:var(--sunk);border-left:3px solid var(--line2);overflow:hidden}
.chip:hover{text-decoration:none;filter:brightness(.97)}
.chip .tm{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.chip.reel{border-left-color:var(--tide);background:var(--tide-wash)}
.chip.carousel{border-left-color:var(--moss);background:var(--moss-wash)}
.chip.est{border-left-style:dashed}
.chip .hl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* sheet */
.sheetbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sheet table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;white-space:nowrap;vertical-align:top}
.sheet thead th{position:sticky;top:0;z-index:3;background:var(--sunk);font-weight:600;text-align:left;padding:7px 8px;font-size:11.5px;color:var(--ink2)}
.sheet thead tr.grp th{top:0;z-index:4;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--surface);padding:4px 8px}
.sheet thead tr.hd th{top:24px}
.sheet .g-plan{background:var(--moss)} .sheet .g-content{background:var(--tide)} .sheet .g-prod{background:var(--ochre)} .sheet .g-perf{background:var(--ink2)} .sheet .g-calc{background:var(--muted)}
.sheet td.fz,.sheet th.fz{position:sticky;left:0;z-index:2;background:var(--surface)}
.sheet thead th.fz{z-index:5;background:var(--sunk)}
.sheet td .cv{display:block;padding:6px 8px;min-height:30px;max-width:260px;overflow:hidden;text-overflow:ellipsis;cursor:cell}
.sheet td.in .cv:hover{background:var(--moss-wash)}
.sheet td.calc{background:var(--sunk);color:var(--ink2)}
.sheet td.calc .cv{cursor:default}
.sheet td.num .cv{text-align:right;font-family:var(--mono)}
.sheet td.over .cv{color:var(--bad);font-weight:700}
.sheet td.edited .cv{box-shadow:inset 3px 0 0 var(--ochre)}
.sheet td select,.sheet td input{width:100%;min-width:150px;border:2px solid var(--moss);border-radius:0;padding:4px 6px;background:var(--surface);font-size:12.5px}
.st{display:inline-block;border-radius:6px;padding:0 7px;font-weight:600;font-size:11.5px}
.st-0{background:var(--sunk);color:var(--muted)} .st-1{background:var(--tide-wash);color:var(--tide)} .st-2{background:var(--ochre-wash);color:var(--ochre)} .st-3{background:var(--moss-wash);color:var(--moss-ink)} .st-4{background:var(--moss);color:var(--surface)} .st-x{background:var(--bad-wash);color:var(--bad)}

/* posts */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gal a{display:flex;flex-direction:column;gap:6px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-width:0;text-decoration:none;box-shadow:var(--shadow)}
.gal a:hover{border-color:var(--moss)}
.gal img,.gal .ph{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:left;border-radius:8px;background:var(--sunk);display:block}
.gal .h{font-weight:600;font-size:13px;line-height:1.3}
.gal .mt{display:flex;gap:10px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.strip{overflow-x:auto;border-radius:10px;background:var(--sunk)}
.strip img{height:200px;width:auto;max-width:none;display:block}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* tables */
.tw{overflow-x:auto}
.tw.tall{max-height:440px;overflow:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;border-bottom:1px solid var(--line2);padding:7px 12px 7px 0;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.t td{border-bottom:1px solid var(--line);padding:8px 12px 8px 0;vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--moss);vertical-align:middle;margin-left:6px}

/* learn */
.inputs{display:flex;flex-direction:column;gap:12px}
.inp{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.steps span{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--moss);color:var(--surface)}
.steps span.done{background:var(--moss-wash);color:var(--moss-ink)}

// ================================================================ helpers

const dt = s => { if (!s) return "–"; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleString("en-IN", {...TZ, day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", hour12:false}); };

const hm = s => new Date(s).toLocaleTimeString("en-GB", {...TZ, hour:"2-digit", minute:"2-digit"});
const ymd = d => new Date(d).toLocaleDateString("en-CA", TZ);
const ago = s => { if (!s) return "never"; const m = (Date.now() - new Date(s)) / 6e4;
  if (m < 0) { const h = -m / 60; return h < 1 ? `in ${Math.round(-m)} min` : h < 48 ? `in ${Math.round(h)} h` : `in ${Math.round(h / 24)} days`; }

function spark(points, color = "var(--moss)") {
  const p = points.filter(x => x.v != null), W = 160, H = 32;
  if (p.length < 2) return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true"><line x1="0" x2="${W}" y1="${H - 4}" y2="${H - 4}" stroke="var(--line)"/></svg>`;

  const X = t => 3 + (W - 10) * (new Date(t).getTime() - t0) / Math.max(1, t1 - t0), Y = v => 3 + (H - 8) * (1 - (v - mn) / Math.max(1e-9, mx - mn));

}
function lineChart(points, {h = 180, color = "var(--moss)"} = {}) {
  const p = points.filter(x => x.v != null);

  const W = 640, pl = 40, pr = 46, pt = 12, pb = 26;

  const raw = Math.max(1, ...p.map(x => x.v)), mag = Math.pow(10, Math.floor(Math.log10(raw))), top = Math.ceil(raw / mag) * mag;

function totalsOverTime(key) {

// ================================================================ tasks: state, pause and staleness
function taskList() {
  const pause = (S.control.tasks || {}).paused || {};

    const failed = t.last_result === "error";
    const state = paused ? "paused" : off ? "off" : running ? "running" : failed ? "failed" : stale ? "stale" : "on";

const TASK_TONE = {on:["Running on schedule","var(--good)","p-good"], running:["Working now","var(--tide)","p-tide"], paused:["Paused from this page","var(--warn)","p-warn"], off:["Off in the Claude app","var(--muted)",""], stale:["Late: no run when expected","var(--bad)","p-bad"], failed:["Last run failed","var(--bad)","p-bad"]};
function alerts() {
  const out = [], st = S.dash.state || {};

  const ts = taskList();
  ts.filter(t => t.stale).forEach(t => out.push(["bad", `${t.name} has not run since ${dt(t.last_run_at)} IST.`]));
  ts.filter(t => t.failed && !t.stale).forEach(t => out.push(["bad", `${t.name} failed on its last run${t.last_note ? ": " + t.last_note : "."}`]));
  vals(S.connectors).filter(c => c.status === "fail").forEach(c => out.push(["bad", `${c.name} is failing: ${c.detail || ""}`]));
  const offs = ts.filter(t => t.off || t.paused);
  if (offs.length) out.push(["warn", `${offs.map(t => t.name).join(", ")} ${offs.length > 1 ? "are" : "is"} not running.`]);
  const lastPub = vals(S.posts).filter(p => p.published_at).sort(by("published_at"))[0];
  if (lastPub && (Date.now() - new Date(lastPub.published_at)) / 36e5 > 24) out.push(["warn", `Nothing posted since ${dt(lastPub.published_at)} IST.`]);
  return out;
}

}

  const zero = [["saves", t.saved], ["shares", t.shares], ["comments", t.comments]].filter(x => !x[1]).map(x => x[0]);
  return `${zero.length ? `<div class="alert warn"><div>So far there are no ${zero.join(", ")} on any post. Reach comes from Reels, but people are not yet saving or sending. The review uses this to choose the next experiment.</div></div>` : ""}

}

V.audience = () => {
  const au = S.dash.audience || {}, tags = (au.hashtags || []).slice().sort((a, b) => (b.avg_reach || 0) - (a.avg_reach || 0));
  const shown = ui.allTags ? tags : tags.slice(0, 20), mx = Math.max(1, ...tags.map(t => t.avg_reach || 0));

    ${card("Accounts we learn from", `<div class="tw tall"><table class="t"><thead><tr><th>Account</th><th>Why</th><th>Last checked</th></tr></thead><tbody>${comps.map(c => `<tr><td><b>${esc(c.handle)}</b><div class="sub">${esc(c.tier || "")}</div></td><td style="min-width:200px">${esc(c.why || "")}${(c.notes || []).length ? `<details><summary class="sub" style="cursor:pointer">Notes (${c.notes.length})</summary>${c.notes.slice().reverse().map(n => `<p style="font-size:12.5px;margin:6px 0">${esc(day(n.at))}: ${esc(n.text)}</p>`).join("")}</details>` : ""}</td><td class="sub" style="white-space:nowrap">${esc(ago(c.last_scanned))}</td></tr>`).join("")}</tbody></table></div>`, {cls:"c6", sub:`${comps.length} accounts`})}

};

// ================================================================ render
const route = () => (location.hash || "#summary").slice(1);

  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<a href="#${k}" ${k === cur ? 'aria-current="page"' : ""}>${l}${badge[k] ? `<span class="ct ${badge[k][1]}">${badge[k][0]}</span>` : ""}</a>`).join("");
}
function render() {
  if (!ready || ui.editing) return;

  renderTabs();
}
let raf = 0; const schedule = () => { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); };
addEventListener("hashchange", e => { const from = new URL(e.oldURL).hash || "#summary"; if (!from.startsWith("#post-")) ui.lastList = from; render(); scrollTo(0, 0); });

// ================================================================ events
const view = document.getElementById("view");
view.addEventListener("click", async e => {
  const b = e.target.closest("button");
  const td = e.target.closest("td[data-col]");
  if (td && !e.target.closest("a") && canWrite && !td.querySelector("select,input")) return editCell(td);
  if (!b) return;

  if (b.dataset.cal) { ui.calOffset = b.dataset.cal === "0" ? 0 : ui.calOffset + +b.dataset.cal; return render(); }
  if (b.dataset.grp) { ui.sheetGroups[b.dataset.grp] = ui.sheetGroups[b.dataset.grp] ? 0 : 1; saveUi(); return render(); }
  if (b.id === "tagsBtn") { ui.allTags = !ui.allTags; return render(); }
  if (b.dataset.t5) return setTop5(b.dataset.t5, b.dataset.s, b);
  if (b.dataset.done) return planChange(b.dataset.done, {status:"done"}, "Marked done on the Plan page", b, "Done.");
  if (b.dataset.drop) return planChange(b.dataset.drop, {status:"dropped"}, "Dropped on the Plan page", b, "Dropped.");
  if (b.dataset.move) return planChange(b.dataset.move, {horizon:b.dataset.hz}, "Moved to " + b.dataset.hz + " on the Plan page", b, "Moved.");
  if (b.dataset.task) return pauseTask(b.dataset.task, b.dataset.act === "pause", b);
  if (b.id === "reviewBtn") return requestReview(b);

});
view.addEventListener("change", e => {
  if (e.target.id === "sheetStatus") { ui.sheetStatus = e.target.value; render(); }
  if (e.target.id === "inFile") pickFile(e.target.files[0]);
});
view.addEventListener("dragover", e => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("on"); } });
view.addEventListener("drop", e => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); pickFile(e.dataTransfer.files[0]); } });
function pickFile(f) { if (!f) return; if (f.size > 20 * 1048576) { toast("That file is over 20 MB. Trim it or share a link instead."); return; } ui.pendingFile = f; const t = document.getElementById("dropTxt"); if (t) t.textContent = f.name; document.getElementById("drop")?.classList.add("on"); }
view.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "planForm") return addPlan();
  if (e.target.id === "inputForm") return addInput();
});
const now = () => new Date().toISOString();
async function guarded(fn, btn, okMsg) {
  if (btn) btn.disabled = true;
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (err) { toast(err && err.code === "quota_exceeded" ? "The page's storage is full. Ask Claude to prune old entries." : "That change did not save. You may not have edit access."); }
  finally { if (btn) btn.disabled = false; }
}
function pauseTask(id, pause, btn) {
  return guarded(async () => {
    const cur = S.control.tasks || {}, paused = {...(cur.paused || {})};
    if (pause) paused[id] = true; else delete paused[id];
    const log = [...(cur.log || []), {at:now(), task:id, action:pause ? "pause" : "resume", by:uid}].slice(-50);
    await db.doc("control/tasks").set({paused, log, updated_at:now()});
  }, btn, pause ? "Stopped. The task skips its next run." : "Resumed from this page.");
}
function requestReview(btn) {
  return guarded(async () => { const cur = S.control.review || {}; await db.doc("control/review").set({...cur, requested_at:now(), requested_by:uid}); }, btn, "Review requested. The agent runs it on its next check.");
}
function planChange(id, patch, note, btn, ok) {
  const p = S.plans[id]; if (!p) return;
  return guarded(async () => { const {id: _i, ...rest} = p; await db.doc("plans/" + id).set({...rest, id, ...patch, updated_at:now(), history:[...(p.history || []), {at:now(), status:patch.status || p.status, note, by:"human"}]}); }, btn, ok);
}
async function addPlan() {
  const t = document.getElementById("planTitle").value.trim(), d = document.getElementById("planDetail").value.trim(), h = document.getElementById("planHz").value, msg = document.getElementById("planMsg");
  if (!t) { msg.textContent = "Give the item a short title."; return; }
  await guarded(async () => {
    const id = "you-" + Date.now().toString(36);
    await db.doc("plans/" + id).set({id, title:t, detail:d, horizon:h, status:"planned", owner:"human", source:"page", updated_at:now(), history:[{at:now(), status:"planned", note:"Added on the Plan page", by:"human"}]});
    document.getElementById("planTitle").value = ""; document.getElementById("planDetail").value = ""; msg.textContent = "";
  }, null, "Added to the plan.");
}
async function addInput() {
  const url = document.getElementById("inUrl").value.trim(), note = document.getElementById("inNote").value.trim(), type = document.getElementById("inType").value;
  const msg = document.getElementById("inMsg"), btn = document.getElementById("inSubmit"), f = ui.pendingFile;
  if (!url && !note && !f) { msg.textContent = "Add a link, a file or a line about the idea."; return; }
  if (url && !isUrl(url)) { msg.textContent = "Links need to start with https://"; return; }
  btn.disabled = true; msg.textContent = f ? "Uploading the file..." : "Sending...";
  try {
    let asset = null;
    if (f && assets) asset = await assets.upload(f);
    await db.collection("inputs").add({type, url:url || null, note:note.slice(0, 600), asset_id:asset?.id || null, asset_url:asset?.url || null, filename:f?.name || null, content_type:f?.type || null, status:"received", submitted_at:now(), submitted_by:uid});
    document.getElementById("inUrl").value = ""; document.getElementById("inNote").value = ""; ui.pendingFile = null;
    msg.textContent = "Sent. The agent studies it on its next run."; render();
  } catch (err) { msg.textContent = err && err.code === "quota_exceeded" ? "Storage is full. Ask Claude to prune old inputs." : "Could not send it. Check the file type and your access."; }
  finally { btn.disabled = false; }
}
function decide(id, dec, btn) {
  const n = document.getElementById("dn-" + id)?.value.trim() || "";
  return guarded(async () => { await db.doc("inputs/" + id).update({decision:dec, decision_note:n.slice(0, 300), decided_at:now(), decided_by:uid}); }, btn, dec === "approve" ? "Approved. The agent schedules it." : dec === "reject" ? "Rejected. The agent drops it." : "Sent back with your note.");
}
function addRow(btn) {
  return guarded(async () => { const id = "row-" + Date.now().toString(36); await db.doc("sheet/" + id).set({id, manual:true, created_at:now(), by:uid, cells:{platform:"Instagram", status:"Idea", owner:"Suryansh", priority:"Medium", language:"English"}}); ui.sheetStatus = "all"; }, btn, "Row added at the bottom. Fill in the date to place it on the calendar.");
}
function editCell(td) {
  const rid = td.dataset.row, key = td.dataset.col, col = COLS.find(c => c[0] === key);
  const row = sheetRows().find(r => r.rid === rid); if (!row) return;
  const cur = row.cells[key] ?? "";
  let el;
  if (col[3].startsWith("list:")) { const opts = LISTS[col[3].slice(5)] || []; el = document.createElement("select"); el.innerHTML = `<option value=""></option>` + [...new Set([...(cur && !opts.includes(cur) ? [cur] : []), ...opts])].map(o => `<option ${o === cur ? "selected" : ""}>${esc(o)}</option>`).join(""); }
  else { el = document.createElement("input"); el.type = col[3] === "date" ? "date" : col[3] === "time" ? "time" : col[3] === "num" || col[3] === "pct" ? "number" : "text"; if (col[3] === "pct") { el.step = "0.01"; el.placeholder = "0.45 = 45%"; } el.value = cur ?? ""; }
  el.id = "cell-edit"; el.setAttribute("aria-label", col[1]);
  td.innerHTML = ""; td.appendChild(el); ui.editing = {rid, key}; el.focus();
  let done = false;
  const finish = async save => {
    if (done) return; done = true; ui.editing = null;
    const v = el.value;
    if (save && String(v) !== String(cur ?? "")) {
      const doc = S.sheet[rid] || (row.manual ? {} : {id:rid, post:row.slug, cells:{}});
      const cells = {...(doc.cells || {}), [key]:col[3] === "num" || col[3] === "pct" ? (v === "" ? "" : +v) : v};
      try { await db.doc("sheet/" + rid).set({...doc, id:rid, cells, updated_at:now(), by:uid}); toast("Saved."); }
      catch (err) { toast("That cell did not save. You may not have edit access."); }
    }
    render();
  };
  el.addEventListener("change", () => { if (el.tagName === "SELECT") finish(true); });
  el.addEventListener("blur", () => finish(true));
  el.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); finish(true); } if (ev.key === "Escape") finish(false); });
}

// sync button
const syncBtn = document.getElementById("syncBtn");
syncBtn.addEventListener("click", () => guarded(async () => { const cur = S.control.sync || {}; await db.doc("control/sync").set({...cur, requested_at:now(), requested_by:uid}); }, syncBtn, "Sync requested. The insight agent runs on its next check."));

// ================================================================ data
function setLive(cls, text) { const l = document.getElementById("live"); l.className = "pill " + cls; l.innerHTML = `<i></i>${esc(text)}`; }
async function start() {
  db = await claude.use("db"); user = await claude.use("user");
  if (!db) { document.getElementById("view").innerHTML = empty("The data store is not available in this view. Open the Field Desk on claude.ai while signed in."); setLive("p-bad", "Offline"); return; }
  try { canWrite = user ? (await user.canEdit()) || (await user.isOwner()) : false; } catch (e) { canWrite = false; }
  try { uid = user ? await user.id() : null; } catch (e) { uid = null; }
  const first = new Set();
  const timer = setTimeout(() => { if (!ready) { ready = true; setLive("p-warn", "Partly loaded"); render(); } }, 10000);
  COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = {id:d.id, ...d.data()}; }); S[c] = o;
    first.add(c); if (first.size === COLLS.length && !ready) { ready = true; clearTimeout(timer); setLive("p-good", "Live"); }
    schedule();
  }, err => { first.add(c); setLive("p-warn", err && err.code === "revoked" ? "Access changed" : "Reconnecting"); }));
  if (canWrite) { syncBtn.hidden = false; assets = await claude.use("assets"); }
  sample = await claude.use("sample");
  if (sample) document.getElementById("askBtn").hidden = false;
}

// ================================================================ ask claude
const turns = []; let ctl = null;
function context() {
  const pick = (o, ks) => Object.fromEntries(ks.filter(k => o[k] != null).map(k => [k, o[k]]));
  return JSON.stringify({account:S.dash.state || {}, tasks:taskList().map(t => pick(t, ["name","state","last_run_at","last_note"])),
    posts:vals(S.posts).map(p => pick(p, ["slug","status","kind","headline","published_at","metrics","format_tags","takeaway"])),
    insights:vals(S.insights).map(i => pick(i, ["text","status","category","confidence","evidence"])), plans:vals(S.plans).map(p => pick(p, ["title","detail","horizon","status","owner"])),
    experiments:vals(S.experiments), inputs:vals(S.inputs).map(x => pick(x, ["type","url","note","status","analysis","proposal","decision"])), hashtags:(S.dash.audience || {}).hashtags}).slice(0, 120000);
}
const RULES = () => `You answer questions about the Instagram test account @${(S.dash.state || {}).handle || "earthspirit_nature"} using only the data below. Be short and specific: plain sentences or a few bullets, cite numbers, and say when the data is too thin. You cannot post, change plans or take actions; say what the owner or the agent would do instead. Never use em dashes or emojis.\n\nDATA:\n${context()}`;
function addMsg(role, text) { const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text; document.getElementById("msgs").appendChild(d); d.scrollIntoView({block:"end"}); return d; }
const ERR = {not_granted:"Claude is not allowed for this page. You can allow it from the artifact's permissions.", rate_limited:"You have hit a usage limit. Try again later.", session_expired:"Sign in again to ask Claude.", prompt_too_large:"The data is too large to send. Ask about one area at a time."};
async function ask(q) {
  if (!sample || !q.trim()) return;
  turns.push({role:"user", content:q}); addMsg("u", q);
  const out = addMsg("a", "Thinking..."), send = document.getElementById("chatSend"); send.textContent = "Stop"; ctl = new AbortController();
  try { const recent = turns.slice(-10);
    const {text} = await sample([{role:"user", content:RULES()}, {role:"assistant", content:"Understood. Ask me about the account."}, ...(recent[0].role === "user" ? recent : recent.slice(1))], {cache:false, signal:ctl.signal, onText:({text}) => { out.textContent = text; }});
    turns.push({role:"assistant", content:text});
  } catch (e) { out.textContent = e.text || ""; if (e.code !== "cancelled") addMsg("a", ERR[e.code] || "Claude could not answer that. Try again in a moment."); turns.pop(); }
  finally { send.textContent = "Send"; ctl = null; }
}
document.getElementById("askBtn").addEventListener("click", () => { const d = document.getElementById("drawer"); d.hidden = false; if (!document.getElementById("msgs").children.length) addMsg("a", "Ask me what is working, what to change in the next posts, or what your inputs taught the agent."); document.getElementById("chatIn").focus(); });
document.getElementById("closeChat").addEventListener("click", () => { document.getElementById("drawer").hidden = true; });
document.getElementById("chatForm").addEventListener("submit", e => { e.preventDefault(); if (ctl) { ctl.abort(); return; } const i = document.getElementById("chatIn"), q = i.value; i.value = ""; ask(q); });
document.getElementById("chatIn").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chatForm").requestSubmit(); } });

renderTabs();
if (window.__PREVIEW_DATA__) { Object.assign(S, window.__PREVIEW_DATA__); canWrite = true; ready = true; setLive("p-good", "Preview"); render(); }
else if (window.claude && claude.use) start();
else document.getElementById("view").innerHTML = empty("Open the Field Desk on claude.ai to see live data.");
})();
</script>
